<nav class="flex items-center justify-between px-6 h-16 border-b border-zinc-800 bg-zinc-950" th:fragment="navbar" xmlns:th="http://www.thymeleaf.org">
    <!-- Left section -->
    <div class="flex items-center gap-4">
        <button id="sidebarToggle" class="text-white hover:text-white transition-colors">
            <i class="fas fa-bars text-lg"></i>
        </button>
        <a th:href="@{/}" class="text-sm text-white hover:text-white transition-colors items-center gap-1 hidden sm:inline-flex">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
    </div>

    <!-- Right section - User Profile Dropdown -->
    <div class="relative group">
        <button class="flex items-center gap-2 px-3 py-2 rounded-lg transition-colors duration-150 group-focus-within:bg-zinc-800 hover:bg-zinc-800 focus:outline-none">
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-red-500 to-red-700 flex items-center justify-center text-white text-sm font-semibold flex-shrink-0" th:text="${loggedInUser != null ? #strings.substring(loggedInUser.fullName, 0, 1) : 'A'}">A</div>
            <span class="hidden sm:inline text-sm font-medium text-white group-hover:text-white transition-colors" th:text="${loggedInUser != null ? loggedInUser.fullName : 'Tài khoản'}">Admin</span>
            <i class="fas fa-chevron-down text-xs text-white group-hover:text-white transition-colors"></i>
        </button>

        <div class="absolute right-0 mt-2 w-56 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible group-focus-within:opacity-100 group-focus-within:visible transition-all duration-200 z-50 origin-top-right scale-95 group-hover:scale-100 group-focus-within:scale-100">
            <div class="px-4 py-3 border-b border-zinc-800">
                <p class="text-sm font-medium text-white" th:text="${loggedInUser?.fullName}">Vũ Văn Đoán</p>
                <p class="text-xs text-white" th:text="${loggedInUser?.role}">Administrator</p>
            </div>

            <a th:href="@{/profile}" class="flex items-center gap-3 px-4 py-3 text-sm text-white hover:bg-zinc-800 hover:text-white transition-colors">
                <i class="fas fa-user w-4 text-center text-white"></i>
                <span>Hồ sơ cá nhân</span>
            </a>

            <div class="border-t border-zinc-800"></div>

            <a th:href="@{/auth/logout}" class="flex items-center gap-3 px-4 py-3 text-sm text-red-400 hover:bg-zinc-800 hover:text-red-300 transition-colors rounded-b-xl">
                <i class="fas fa-sign-out-alt w-4 text-center"></i>
                <span>Đăng xuất</span>
            </a>
        </div>
    </div>
</nav>
