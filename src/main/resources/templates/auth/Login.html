<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Cinema System</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --cinema-red: #E50914;
            --deep-charcoal: #121212;
            --glass-bg: rgba(255, 255, 255, 0.1);
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--deep-charcoal);
        }

        /* Background image with Overlay */
        .bg-image {
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
            url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Glassmorphism Card */
        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .login-header h2 {
            color: #fff;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .login-header p {
            color: #ffffff;
            font-size: 0.9rem;
        }

        /* Input Styling */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 10px 0 0 10px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 0 10px 10px 0;
            padding: 12px;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--cinema-red);
            color: #fff;
            box-shadow: none;
        }

        .form-check-label, .forgot-link {
            color: #ffffff;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .forgot-link:hover {
            color: var(--cinema-red);
        }

        /* Cinema Red Button */
        .btn-login {
            background-color: var(--cinema-red);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            background-color: #b20710;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.6);
            transform: translateY(-2px);
        }

        /* Social Login */
        .social-login {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 25px;
            padding-top: 20px;
        }

        .btn-social {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 10px;
            margin: 0 5px;
            transition: 0.3s;
        }

        .btn-social:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="bg-image">
    <div class="login-card animate__animated animate__fadeInDown">
        <div class="login-header text-center mb-4">
            <h2 class="mb-2"><i class="fas fa-film text-danger me-2"></i>SMART CINEMA</h2>
            <p>Chào mừng bạn trở lại! Vui lòng đăng nhập.</p>
        </div>

        <!-- Form Thymeleaf -->
        <form th:action="@{/auth/login}" method="post">
            <!-- Username -->
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Tên đăng nhập" required>
            </div>

            <!-- Password -->
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Mật khẩu" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember-me">
                    <label class="form-check-label" for="remember">Ghi nhớ tôi</label>
                </div>
                <a href="#" class="forgot-link">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn btn-login btn-danger w-100 mb-3">Đăng Nhập</button>

            <div class="social-login text-center">
                <p class="text-white small mb-3">Hoặc đăng nhập bằng</p>
                <div class="d-flex justify-content-center">
                    <a href="#" class="btn btn-social"><i class="fab fa-google text-danger"></i></a>
                    <a href="#" class="btn btn-social"><i class="fab fa-facebook-f text-primary"></i></a>
                </div>
            </div>

            <div class="text-center mt-4">
                <p class="text-white small">Chưa có tài khoản? <a th:href="@{/auth/register}" class="text-white text-decoration-none">Đăng ký ngay</a></p>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
