<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header}">
    <title>Hồ sơ cá nhân</title>
</head>
<body class="bg-zinc-950 min-h-screen antialiased">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

    <div class="ml-[260px] min-h-screen flex flex-col">
        <nav th:replace="~{layout/navbar_admin :: navbar}"></nav>

        <main class="flex-1 p-6 lg:p-8">
            <!-- Flash message -->
            <div th:if="${message}"
                 class="mb-6 flex items-center gap-3 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-xl px-5 py-4 text-sm animate-fade-in">
                <i class="fas fa-check-circle text-emerald-400"></i>
                <span th:text="${message}">Cập nhật thành công</span>
                <button onclick="this.parentElement.remove()"
                        class="ml-auto text-emerald-400/50 hover:text-emerald-400 transition-colors text-lg leading-none">&times;</button>
            </div>

            <!-- Header section -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-white font-poppins">Hồ sơ cá nhân</h1>
                    <p class="text-white text-sm mt-1">Quản lý thông tin tài khoản của bạn</p>
                </div>
                <a th:href="@{/profile/edit}"
                   class="inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-red-600 to-red-800 hover:from-red-500 hover:to-red-700 text-white text-sm font-semibold rounded-xl shadow-lg shadow-red-600/20 hover:shadow-red-500/30 transition-all duration-300">
                    <i class="fas fa-user-edit"></i>
                    Chỉnh sửa thông tin
                </a>
            </div>

            <!-- Grid 2 columns: left card + right details -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- ===== LEFT COLUMN: User Card ===== -->
                <div class="lg:col-span-1">
                    <div class="bg-zinc-900/80 backdrop-blur-xl border border-zinc-800 rounded-2xl p-8 text-center">
                        <!-- Avatar with red glow border -->
                        <div class="relative mx-auto w-28 h-28 mb-5">
                            <img th:if="${loggedInUser?.avatarUrl}"
                                 th:src="${loggedInUser.avatarUrl}"
                                 alt="Avatar"
                                 class="w-full h-full rounded-full object-cover ring-4 ring-red-500/50 shadow-lg shadow-red-500/20" />
                            <div th:unless="${loggedInUser?.avatarUrl}"
                                 class="w-full h-full rounded-full bg-gradient-to-br from-red-500 to-rose-700 flex items-center justify-center ring-4 ring-red-500/50 shadow-lg shadow-red-500/20">
                                <span class="text-4xl font-bold text-white"
                                      th:text="${#strings.substring(profile?.fullName != null ? profile.fullName : loggedInUser?.fullName, 0, 1)}">A</span>
                            </div>
                        </div>

                        <!-- Admin name -->
                        <h2 class="text-xl font-bold text-white" th:text="${profile?.fullName}">Vũ Văn Đoán</h2>

                        <!-- Role badge (đỏ) -->
                        <div class="mt-3">
                            <span class="inline-flex items-center gap-1.5 px-4 py-1.5 bg-red-600/15 text-red-500 text-xs font-semibold rounded-full border border-red-500/20">
                                <i class="fas fa-shield-alt"></i>
                                <span th:text="${loggedInUser?.role}">ADMIN</span>
                            </span>
                        </div>

                        <!-- Username row -->
                        <div class="mt-6 pt-6 border-t border-zinc-800">
                            <p class="text-xs text-white uppercase tracking-wider mb-1">Tên đăng nhập</p>
                            <p class="text-sm text-white font-medium" th:text="${loggedInUser?.userName}">username</p>
                        </div>
                    </div>
                </div>

                <!-- ===== RIGHT COLUMN: Details ===== -->
                <div class="lg:col-span-2">
                    <div class="bg-zinc-900/80 backdrop-blur-xl border border-zinc-800 rounded-2xl p-8">
                        <h3 class="text-lg font-semibold text-white mb-6 flex items-center gap-2">
                            <i class="fas fa-info-circle text-red-500"></i>
                            Thông tin chi tiết
                        </h3>

                        <div class="divide-y divide-zinc-800/50">
                            <!-- Email -->
                            <div class="flex items-center gap-4 py-4 first:pt-0 last:pb-0">
                                <div class="w-10 h-10 rounded-lg bg-red-500/10 flex items-center justify-center flex-shrink-0">
                                    <i class="fas fa-envelope text-red-500 text-sm"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-xs text-white uppercase tracking-wider">Email</p>
                                    <p class="text-sm text-white font-medium truncate"
                                       th:text="${profile?.email != null ? profile.email : (loggedInUser?.email != null ? loggedInUser.email : 'Chưa cập nhật')}">admin@smartcinema.com</p>
                                </div>
                            </div>

                            <!-- Phone -->
                            <div class="flex items-center gap-4 py-4">
                                <div class="w-10 h-10 rounded-lg bg-red-500/10 flex items-center justify-center flex-shrink-0">
                                    <i class="fas fa-phone-alt text-red-500 text-sm"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-xs text-white uppercase tracking-wider">Số điện thoại</p>
                                    <p class="text-sm text-white font-medium"
                                       th:text="${profile?.phone != null ? profile.phone : 'Chưa cập nhật'}">0901234567</p>
                                </div>
                            </div>

                            <!-- Address -->
                            <div class="flex items-center gap-4 py-4">
                                <div class="w-10 h-10 rounded-lg bg-red-500/10 flex items-center justify-center flex-shrink-0">
                                    <i class="fas fa-map-marker-alt text-red-500 text-sm"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-xs text-white uppercase tracking-wider">Địa chỉ</p>
                                    <p class="text-sm text-white font-medium"
                                       th:text="${profile?.address != null ? profile.address : 'Chưa cập nhật'}">Hà Nội, Việt Nam</p>
                                </div>
                            </div>

                            <!-- Join date -->
                            <div class="flex items-center gap-4 py-4">
                                <div class="w-10 h-10 rounded-lg bg-red-500/10 flex items-center justify-center flex-shrink-0">
                                    <i class="fas fa-calendar-alt text-red-500 text-sm"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-xs text-white uppercase tracking-wider">Ngày tham gia</p>
                                    <p class="text-sm text-white font-medium"
                                       th:text="${#temporals.format(loggedInUser?.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{layout/footer :: footer}"></footer>
    </div>
</body>
</html>
