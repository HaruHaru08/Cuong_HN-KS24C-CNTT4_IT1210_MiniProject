<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--@elvariable id="movies" type="java.util.List<com.example.smart_cinema_booking_system.model.Movie>"-->
<head th:replace="~{layout/header :: header}">
    <title>Danh sách phim | Cinema Pro</title>
</head>
<body class="bg-[#121212]">
    <div class="flex">
        <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

        <div id="main-content-container" class="flex-1 flex flex-col min-w-0">
            <header th:replace="~{layout/navbar_admin :: navbar}"></header>

            <main class="flex-1 p-8 animate-fade-in">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                    <div>
                        <h1 class="text-3xl font-bold text-white tracking-tight">Danh sach phim</h1>
                        <p class="text-white mt-2">Xem va quan ly phim tren he thong.</p>
                    </div>
                    <a th:href="@{/admin/movies/add}" class="inline-flex items-center px-6 py-2.5 bg-cinema-red text-white text-sm font-bold rounded-lg hover:shadow-[0_0_15px_rgba(229,9,20,0.5)] transition-all">
                        <i class="fas fa-plus mr-2"></i> Them phim moi
                    </a>
                </div>

                <div th:if="${message}" class="mb-6 p-4 bg-green-500 bg-opacity-10 border border-green-500 border-opacity-20 rounded-xl text-green-500 text-sm flex items-center">
                    <i class="fas fa-check-circle mr-3"></i>
                    <span th:text="${message}"></span>
                </div>
                <div th:if="${error}" class="mb-6 p-4 bg-red-500 bg-opacity-10 border border-red-500 border-opacity-20 rounded-xl text-red-500 text-sm flex items-center">
                    <i class="fas fa-exclamation-circle mr-3"></i>
                    <span th:text="${error}"></span>
                </div>

                <div class="card-cinema overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-white bg-opacity-5 text-white text-xs uppercase tracking-widest">
                                <th class="px-6 py-4 font-semibold">Poster</th>
                                <th class="px-6 py-4 font-semibold">Ten phim</th>
                                <th class="px-6 py-4 font-semibold text-center">Thoi luong</th>
                                <th class="px-6 py-4 font-semibold">Ngay khoi chieu</th>
                                <th class="px-6 py-4 font-semibold text-right">Thao tac</th>
                            </tr>
                        </thead>
                        <tbody class="text-white divide-y divide-white divide-opacity-5">
                            <tr th:each="movie : ${movies}" class="hover:bg-white hover:bg-opacity-[0.02] transition-colors">
                                <td class="px-6 py-3">
                                    <img th:if="${movie.posterUrl}" th:src="${movie.posterUrl}"
                                         class="w-12 h-16 rounded-md object-cover shadow-lg border border-white border-opacity-10" alt="Poster">
                                    <img th:unless="${movie.posterUrl}" src="https://via.placeholder.com/60x80?text=No+Img"
                                         class="w-12 h-16 rounded-md object-cover opacity-50" alt="No Poster">
                                </td>
                                <td class="px-6 py-4">
                                    <span class="text-sm font-bold text-white" th:text="${movie.title}"></span>
                                </td>
                                <td class="px-6 py-4 text-sm text-center font-mono" th:text="${movie.duration + 'm'}"></td>
                                <td class="px-6 py-4 text-sm text-white" th:text="${movie.releaseDate}"></td>
                                <td class="px-6 py-4 text-sm text-right">
                                    <div class="flex justify-end gap-2">
                                        <a th:href="@{/admin/movies/edit/{id}(id=${movie.id})}" class="p-2 text-white hover:text-blue-400 transition-colors">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <a th:href="@{/admin/movies/delete/{id}(id=${movie.id})}"
                                           onclick="return confirm('Xoa phim nay se xoa tat ca suat chieu lien quan. Ban chac chan chu?')"
                                           class="p-2 text-white hover:text-cinema-red transition-colors">
                                            <i class="fas fa-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(movies)}">
                                <td colspan="5" class="px-6 py-20 text-center text-white italic">
                                    Chua co phim nao trong danh sach
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>

            <footer th:replace="~{layout/footer :: footer}"></footer>
        </div>
    </div>
</body>
</html>
