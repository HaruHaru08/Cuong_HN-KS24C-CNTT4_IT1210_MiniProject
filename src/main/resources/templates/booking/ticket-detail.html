<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Chi Tiết Vé | Smart Cinema</title>
    <style>
        :root {
            --cr: #E50914;
        }
        .bp-card {
            max-width: 420px;
            margin: 0 auto;
            background: rgba(24,24,27,0.98);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 0 0 1px rgba(229,9,20,0.08), 0 24px 80px rgba(0,0,0,0.5);
            position: relative;
        }
        .bp-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cr), transparent);
            opacity: 0.4;
        }

        .bp-top {
            padding: 32px 28px 24px;
            text-align: center;
        }
        .bp-top h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 20px;
            color: #fff;
            margin-bottom: 4px;
        }
        .bp-top .sub {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .bp-film {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 28px;
            background: rgba(255,255,255,0.02);
            border-top: 1px solid rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .bp-film-poster {
            width: 56px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        .bp-film-poster-placeholder {
            width: 56px;
            height: 80px;
            border-radius: 8px;
            background: linear-gradient(135deg,#27272a,#3f3f46);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .bp-film-info h2 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            font-family: 'Poppins', sans-serif;
        }
        .bp-film-info p {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 2px;
        }

        .bp-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            padding: 20px 28px;
        }
        .bp-detail-item {
            padding: 10px 0;
        }
        .bp-detail-item:nth-child(1),
        .bp-detail-item:nth-child(2) {
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .bp-detail-item label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.25);
            margin-bottom: 4px;
        }
        .bp-detail-item span {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .bp-perf {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 28px;
        }
        .bp-perf-line {
            flex: 1;
            height: 2px;
            background: repeating-linear-gradient(
                to right,
                rgba(255,255,255,0.08) 0px,
                rgba(255,255,255,0.08) 8px,
                transparent 8px,
                transparent 16px
            );
        }
        .bp-perf-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .bp-qr-section {
            padding: 24px 28px 20px;
            text-align: center;
        }
        .bp-qr-box {
            width: 160px;
            height: 160px;
            margin: 0 auto 12px;
            background: #fff;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        .bp-qr-box svg {
            width: 100%;
            height: 100%;
        }
        .bp-qr-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.2);
        }

        .bp-seats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            padding: 0 28px 16px;
        }
        .bp-seat-chip {
            padding: 4px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            background: rgba(229,9,20,0.12);
            border: 1px solid rgba(229,9,20,0.15);
        }
        .bp-seat-chip--vip {
            border-color: rgba(245,158,11,0.3);
            background: rgba(245,158,11,0.1);
            color: #fde68a;
        }

        .bp-total {
            padding: 16px 28px 24px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .bp-total label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.2);
        }
        .bp-total .amount {
            font-size: 28px;
            font-weight: 800;
            color: var(--cr);
            font-family: 'Poppins', sans-serif;
            letter-spacing: -0.5px;
        }

        .bp-barcode {
            padding: 0 28px 28px;
            text-align: center;
        }
        .bp-barcode svg {
            width: 100%;
            height: 36px;
        }

        .bp-footer {
            padding: 16px 28px;
            text-align: center;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .bp-footer p {
            font-size: 10px;
            color: rgba(255,255,255,0.15);
            letter-spacing: 1px;
        }

        .bp-status-ribbon {
            position: absolute;
            top: 16px;
            right: -32px;
            padding: 4px 40px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transform: rotate(45deg);
            z-index: 2;
        }
        .bp-status-ribbon--paid { background: rgba(22,163,74,0.2); color: #86efac; border: 1px solid rgba(22,163,74,0.2); }
        .bp-status-ribbon--cancelled { background: rgba(229,9,20,0.15); color: #fca5a5; border: 1px solid rgba(229,9,20,0.15); }
        .bp-status-ribbon--pending { background: rgba(234,179,8,0.15); color: #fde68a; border: 1px solid rgba(234,179,8,0.15); }

        .bp-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            transition: all 0.2s;
            text-decoration: none;
        }
        .bp-back:hover {
            color: #fff;
            background: rgba(255,255,255,0.04);
        }
    </style>
</head>
<body>

    <div layout:fragment="content">
        <div class="min-h-screen py-8 md:py-12 px-4" style="background:var(--zinc-950);">

            <div class="max-w-4xl mx-auto">

                <!-- Back -->
                <div class="mb-6">
                    <a th:href="@{/booking/my-bookings}" class="bp-back">
                        <i class="fas fa-arrow-left"></i> Lịch sử đặt vé
                    </a>
                </div>

                <!-- Boarding Pass Card -->
                <div class="bp-card">

                    <!-- Status ribbon -->
                    <div th:if="${booking.status.name() == 'PAID'}"
                         class="bp-status-ribbon bp-status-ribbon--paid">Đã thanh toán</div>
                    <div th:if="${booking.status.name() == 'CANCELLED'}"
                         class="bp-status-ribbon bp-status-ribbon--cancelled">Đã hủy</div>
                    <div th:if="${booking.status.name() == 'PENDING'}"
                         class="bp-status-ribbon bp-status-ribbon--pending">Chờ thanh toán</div>

                    <!-- Top -->
                    <div class="bp-top">
                        <h1>BOARDING PASS</h1>
                        <p class="sub">Smart Cinema</p>
                    </div>

                    <!-- Film info -->
                    <div class="bp-film">
                        <img th:if="${showtime.movie.posterUrl != null and !#strings.isEmpty(showtime.movie.posterUrl)}"
                             th:src="@{${showtime.movie.posterUrl}}" alt="poster" class="bp-film-poster"
                             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                        <div th:if="${showtime.movie.posterUrl == null or #strings.isEmpty(showtime.movie.posterUrl)}"
                             class="bp-film-poster-placeholder" style="display:none;">
                            <i class="fas fa-film text-lg text-white"></i>
                        </div>
                        <div class="bp-film-info">
                            <h2 th:text="${showtime.movie.title}">Movie</h2>
                            <p>
                                <span th:text="${showtime.movie.duration} + ' phút'">120 phút</span>
                                <span class="mx-1.5">·</span>
                                <span th:text="${showtime.room.name}">Phòng 1</span>
                            </p>
                        </div>
                    </div>

                    <!-- Details grid -->
                    <div class="bp-details">
                        <div class="bp-detail-item">
                            <label>Ngày chiếu</label>
                            <span th:text="${#temporals.format(showtime.startTime, 'dd/MM/yyyy')}">01/01/2024</span>
                        </div>
                        <div class="bp-detail-item">
                            <label>Giờ chiếu</label>
                            <span th:text="${#temporals.format(showtime.startTime, 'HH:mm')}">00:00</span>
                        </div>
                        <div class="bp-detail-item">
                            <label>Mã đặt vé</label>
                            <span style="font-family:'Courier New',monospace;font-size:13px;letter-spacing:0.5px;" th:text="'#' + ${booking.id}">#123</span>
                        </div>
                        <div class="bp-detail-item">
                            <label>Trạng thái</label>
                            <span th:if="${booking.status.name() == 'PAID'}" style="color:#86efac;">Đã thanh toán</span>
                            <span th:if="${booking.status.name() == 'CANCELLED'}" style="color:#fca5a5;">Đã hủy</span>
                            <span th:if="${booking.status.name() == 'PENDING'}" style="color:#fde68a;">Chờ thanh toán</span>
                        </div>
                    </div>

                    <!-- Perforated line -->
                    <div class="bp-perf">
                        <span class="bp-perf-dot"></span>
                        <span class="bp-perf-line"></span>
                        <span class="bp-perf-dot"></span>
                    </div>

                    <!-- QR Code -->
                    <div class="bp-qr-section">
                        <div class="bp-qr-box">
                            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                                <rect width="100" height="100" fill="#fff"/>
                                <rect x="8" y="8" width="20" height="20" fill="#111" rx="2"/>
                                <rect x="36" y="8" width="8" height="8" fill="#111"/>
                                <rect x="52" y="8" width="8" height="8" fill="#111"/>
                                <rect x="68" y="8" width="20" height="20" fill="#111" rx="2"/>
                                <rect x="8" y="36" width="8" height="8" fill="#111"/>
                                <rect x="24" y="36" width="16" height="8" fill="#111"/>
                                <rect x="52" y="36" width="16" height="8" fill="#111"/>
                                <rect x="76" y="36" width="8" height="8" fill="#111"/>
                                <rect x="8" y="52" width="8" height="8" fill="#111"/>
                                <rect x="36" y="52" width="8" height="8" fill="#111"/>
                                <rect x="60" y="52" width="16" height="8" fill="#111"/>
                                <rect x="84" y="52" width="8" height="8" fill="#111"/>
                                <rect x="8" y="68" width="20" height="20" fill="#111" rx="2"/>
                                <rect x="36" y="68" width="8" height="8" fill="#111"/>
                                <rect x="60" y="68" width="8" height="8" fill="#111"/>
                                <rect x="76" y="60" width="8" height="16" fill="#111"/>
                                <rect x="52" y="76" width="8" height="12" fill="#111"/>
                                <rect x="68" y="68" width="20" height="20" fill="#111" rx="2"/>
                                <rect x="24" y="52" width="4" height="4" fill="#111"/>
                                <rect x="24" y="60" width="4" height="4" fill="#111"/>
                                <rect x="36" y="44" width="4" height="4" fill="#111"/>
                                <rect x="44" y="60" width="4" height="4" fill="#111"/>
                                <rect x="52" y="52" width="4" height="4" fill="#111"/>
                                <rect x="60" y="44" width="4" height="4" fill="#111"/>
                                <rect x="84" y="44" width="4" height="4" fill="#111"/>
                                <rect x="24" y="76" width="4" height="4" fill="#111"/>
                                <rect x="36" y="84" width="4" height="4" fill="#111"/>
                                <rect x="44" y="76" width="4" height="4" fill="#111"/>
                                <rect x="92" y="8" width="4" height="4" fill="#111"/>
                                <rect x="92" y="20" width="4" height="4" fill="#111"/>
                                <rect x="36" y="24" width="4" height="4" fill="#111"/>
                                <rect x="52" y="24" width="4" height="4" fill="#111"/>
                                <rect x="76" y="24" width="4" height="4" fill="#111"/>
                                <rect x="84" y="24" width="4" height="4" fill="#111"/>
                            </svg>
                        </div>
                        <p class="bp-qr-label">Quét mã tại quầy</p>
                    </div>

                    <!-- Seats -->
                    <div class="bp-seats">
                        <th:block th:each="ticket : ${tickets}">
                            <span class="bp-seat-chip"
                                  th:classappend="${ticket.seat.seatType.typeName == 'VIP' or ticket.seat.seatType.typeName == 'Sweetbox'} ? 'bp-seat-chip--vip' : ''"
                                  th:text="${ticket.seat.seatNumber}">A1</span>
                        </th:block>
                    </div>

                    <!-- Total -->
                    <div class="bp-total">
                        <label>Tổng tiền</label>
                        <div class="amount" th:text="${#numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</div>
                    </div>

                    <!-- Barcode -->
                    <div class="bp-barcode">
                        <svg viewBox="0 0 380 36" xmlns="http://www.w3.org/2000/svg">
                            <rect x="0" y="0" width="6" height="36" fill="rgba(255,255,255,0.15)"/>
                            <rect x="10" y="4" width="3" height="28" fill="rgba(255,255,255,0.2)"/>
                            <rect x="17" y="0" width="8" height="36" fill="rgba(255,255,255,0.12)"/>
                            <rect x="29" y="6" width="4" height="24" fill="rgba(255,255,255,0.18)"/>
                            <rect x="37" y="0" width="6" height="36" fill="rgba(255,255,255,0.15)"/>
                            <rect x="47" y="2" width="3" height="32" fill="rgba(255,255,255,0.22)"/>
                            <rect x="54" y="0" width="9" height="36" fill="rgba(255,255,255,0.1)"/>
                            <rect x="67" y="8" width="4" height="20" fill="rgba(255,255,255,0.16)"/>
                            <rect x="75" y="0" width="5" height="36" fill="rgba(255,255,255,0.14)"/>
                            <rect x="84" y="3" width="7" height="30" fill="rgba(255,255,255,0.19)"/>
                            <rect x="95" y="0" width="3" height="36" fill="rgba(255,255,255,0.12)"/>
                            <rect x="102" y="5" width="6" height="26" fill="rgba(255,255,255,0.17)"/>
                            <rect x="112" y="0" width="4" height="36" fill="rgba(255,255,255,0.2)"/>
                            <rect x="120" y="1" width="8" height="34" fill="rgba(255,255,255,0.13)"/>
                            <rect x="132" y="7" width="3" height="22" fill="rgba(255,255,255,0.15)"/>
                            <rect x="139" y="0" width="6" height="36" fill="rgba(255,255,255,0.11)"/>
                            <rect x="149" y="4" width="5" height="28" fill="rgba(255,255,255,0.21)"/>
                            <rect x="158" y="0" width="7" height="36" fill="rgba(255,255,255,0.16)"/>
                            <rect x="169" y="2" width="3" height="32" fill="rgba(255,255,255,0.14)"/>
                            <rect x="176" y="0" width="6" height="36" fill="rgba(255,255,255,0.18)"/>
                            <rect x="186" y="6" width="4" height="24" fill="rgba(255,255,255,0.12)"/>
                            <rect x="194" y="0" width="9" height="36" fill="rgba(255,255,255,0.19)"/>
                            <rect x="207" y="3" width="3" height="30" fill="rgba(255,255,255,0.15)"/>
                            <rect x="214" y="0" width="5" height="36" fill="rgba(255,255,255,0.13)"/>
                            <rect x="223" y="1" width="7" height="34" fill="rgba(255,255,255,0.2)"/>
                            <rect x="234" y="8" width="4" height="20" fill="rgba(255,255,255,0.11)"/>
                            <rect x="242" y="0" width="6" height="36" fill="rgba(255,255,255,0.17)"/>
                            <rect x="252" y="5" width="3" height="26" fill="rgba(255,255,255,0.16)"/>
                            <rect x="259" y="0" width="8" height="36" fill="rgba(255,255,255,0.14)"/>
                            <rect x="271" y="2" width="5" height="32" fill="rgba(255,255,255,0.18)"/>
                            <rect x="280" y="0" width="4" height="36" fill="rgba(255,255,255,0.12)"/>
                            <rect x="288" y="7" width="7" height="22" fill="rgba(255,255,255,0.19)"/>
                            <rect x="299" y="0" width="3" height="36" fill="rgba(255,255,255,0.15)"/>
                            <rect x="306" y="4" width="6" height="28" fill="rgba(255,255,255,0.2)"/>
                            <rect x="316" y="0" width="5" height="36" fill="rgba(255,255,255,0.11)"/>
                            <rect x="325" y="1" width="8" height="34" fill="rgba(255,255,255,0.17)"/>
                            <rect x="337" y="6" width="3" height="24" fill="rgba(255,255,255,0.13)"/>
                            <rect x="344" y="0" width="6" height="36" fill="rgba(255,255,255,0.16)"/>
                            <rect x="354" y="3" width="4" height="30" fill="rgba(255,255,255,0.21)"/>
                            <rect x="362" y="0" width="8" height="36" fill="rgba(255,255,255,0.14)"/>
                            <rect x="374" y="5" width="3" height="26" fill="rgba(255,255,255,0.18)"/>
                        </svg>
                    </div>

                    <!-- Footer -->
                    <div class="bp-footer">
                        <p th:text="'Booking #' + ${booking.id} + ' · Smart Cinema'">Booking #0 · Smart Cinema</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
