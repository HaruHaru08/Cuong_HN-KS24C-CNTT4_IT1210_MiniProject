<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Chọn ghế - Smart Cinema</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b0f15 !important; font-family: 'Inter', sans-serif; color: #fff !important; }
        .cinema-wrap { max-width: 840px; margin: 0 auto; padding: 32px 20px 20px; }
        h1 { font-size: 26px; font-weight: 900; text-align: center; color: #fff; letter-spacing: -0.5px; margin-bottom: 6px; }
        .sub-info { text-align: center; color: rgba(255,255,255,0.3); font-size: 13px; font-weight: 500; margin-bottom: 28px; }
        .sub-info .sep { margin: 0 10px; opacity: 0.2; }
        .screen-section { text-align: center; margin-bottom: 32px; }
        .screen-curve { width: 50%; height: 6px; margin: 0 auto 8px; background: linear-gradient(90deg, transparent, rgba(229,9,20,0.5), #E50914, rgba(229,9,20,0.5), transparent); border-radius: 999px; box-shadow: 0 0 40px rgba(229,9,20,0.1); }
        .screen-label { color: rgba(255,255,255,0.15); font-size: 10px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; }
        .grid-wrapper { display: flex; flex-direction: column; align-items: center; margin-bottom: 28px; }
        .grid-row { display: flex; align-items: center; gap: 5px; margin-bottom: 6px; }
        .row-label { width: 28px; height: 36px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: rgba(255,255,255,0.2); font-size: 12px; flex-shrink: 0; user-select: none; }
        .col-num { width: 38px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: rgba(255,255,255,0.1); font-weight: 700; flex-shrink: 0; user-select: none; }
        .seat { width: 38px; height: 34px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; cursor: pointer; transition: all 0.12s ease; border: none; flex-shrink: 0; user-select: none; position: relative; }
        .seat:hover { transform: scale(1.1); z-index: 2; }
        .seat-normal { background: #3a3f47; color: rgba(255,255,255,0.8); }
        .seat-normal:hover { background: #505760; }
        .seat-vip { background: #f97316; color: #fff; box-shadow: 0 2px 10px rgba(249,115,22,0.2); }
        .seat-vip:hover { background: #fb923c; box-shadow: 0 4px 18px rgba(249,115,22,0.3); }
        .seat-sweetbox { background: #dc2626; color: #fff; box-shadow: 0 2px 10px rgba(220,38,38,0.15); }
        .seat-sweetbox:hover { background: #ef4444; box-shadow: 0 4px 18px rgba(220,38,38,0.25); }
        .seat-selected { background: #3b82f6 !important; color: #fff !important; box-shadow: 0 0 0 2px rgba(59,130,246,0.5), 0 4px 16px rgba(59,130,246,0.25) !important; transform: scale(1.05); }
        .seat-selected:hover { transform: scale(1.1); }
        .seat-booked { background: rgba(255,255,255,0.05) !important; color: rgba(255,255,255,0.12) !important; cursor: not-allowed !important; border: 1px solid rgba(255,255,255,0.04); }
        .seat-booked::after { content: '\f005'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; font-size: 7px; color: rgba(255,255,255,0.07); bottom: 1px; right: 3px; }
        .seat-booked:hover { transform: none !important; }
        .seat-empty { visibility: hidden; pointer-events: none; }
        .legend { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 18px; padding: 14px 20px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); border-radius: 12px; margin-bottom: 24px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.45); }
        .legend-box { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; }
        .bottom-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 24px; background: rgba(22,26,32,0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-radius: 14px; }
        .bottom-left { display: flex; flex-direction: column; gap: 4px; }
        .bottom-left .label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255,255,255,0.2); }
        .bottom-left .seats-display { font-size: 15px; font-weight: 700; color: #fff; }
        .bottom-left .seats-display .empty-text { font-size: 13px; color: rgba(255,255,255,0.15); font-weight: 500; }
        .bottom-left .total-display { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.6); margin-top: 2px; }
        .bottom-left .total-display .amount { color: #f97316; font-weight: 800; font-size: 15px; }
        .btn-back { display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px; border-radius: 10px; font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); text-decoration: none; transition: all 0.2s; cursor: pointer; }
        .btn-back:hover { background: rgba(255,255,255,0.08); color: #fff; text-decoration: none; }
        .btn-pay { display: inline-flex; align-items: center; gap: 8px; padding: 10px 28px; border-radius: 10px; font-size: 13px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #E50914, #9b070d); border: none; cursor: pointer; transition: all 0.25s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-pay:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(229,9,20,0.25); filter: brightness(1.1); }
        .btn-pay:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        .btn-group { display: flex; align-items: center; gap: 10px; }
        .footer-text { text-align: center; margin-top: 18px; font-size: 9px; font-weight: 500; color: rgba(255,255,255,0.06); letter-spacing: 0.5px; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0b0f15; }
        ::-webkit-scrollbar-thumb { background: #2a2d32; border-radius: 10px; }
        @media (max-width: 600px) {
            .cinema-wrap { padding: 20px 10px; }
            .seat { width: 30px; height: 28px; font-size: 8px; }
            .row-label { width: 22px; font-size: 10px; }
            .col-num { width: 30px; font-size: 7px; }
            .grid-row { gap: 3px; margin-bottom: 4px; }
            .bottom-bar { flex-direction: column; align-items: stretch; gap: 12px; }
            .btn-group { justify-content: stretch; }
            .btn-back, .btn-pay { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>
<div layout:fragment="content">
<div class="cinema-wrap">

    <h1><span th:text="${showtime.room.name}">Phòng chiếu số 13</span></h1>
    <p class="sub-info">
        <span th:text="${showtime.movie.title}">Doraemon</span>
        <span class="sep">|</span>
        <span th:text="${#temporals.format(showtime.startTime, 'HH:mm, dd/MM/yyyy')}">22:30, 11/05/2026</span>
        <span class="sep">|</span>
        <span th:text="${showtime.movie.duration} + ' phút'">120 phút</span>
    </p>

    <div class="screen-section">
        <div class="screen-curve"></div>
        <div class="screen-label">MÀN HÌNH</div>
    </div>

    <div class="grid-wrapper">
        <th:block th:with="firstRow=${seatsByRow.values().iterator().next()}, maxCols=${firstRow.size()}">
            <div class="grid-row" style="margin-bottom:10px;">
                <div class="row-label"></div>
                <div class="col-num" th:each="i : ${#numbers.sequence(1, maxCols)}" th:text="${i}">1</div>
            </div>
        </th:block>
        <th:block th:each="rowEntry : ${seatsByRow}">
            <div class="grid-row">
                <th:block th:with="rowLetter=${#strings.substring(rowEntry.value[0].seatNumber, 0, 1)}">
                    <div class="row-label" th:text="${rowLetter}">A</div>
                    <th:block th:each="seat : ${rowEntry.value}">
                        <th:block th:switch="${seat.seatStatus}">
                            <button th:case="'available'"
                                    th:class="'seat ' + (${seat.typeName == 'vip'} ? 'seat-vip' : (${seat.typeName == 'sweetbox'} ? 'seat-sweetbox' : 'seat-normal'))"
                                    type="button"
                                    th:attr="data-seat-id=${seat.id}, data-price=${seat.basePrice}, data-number=${seat.seatNumber}"
                                    th:data-type="${seat.typeName}">
                                <span th:text="${#strings.substring(seat.seatNumber, 1)}">1</span>
                            </button>
                            <div th:case="'booked'" class="seat seat-booked"><span th:text="${#strings.substring(seat.seatNumber, 1)}">1</span></div>
                            <div th:case="'selected'" class="seat seat-selected"><span th:text="${#strings.substring(seat.seatNumber, 1)}">1</span></div>
                            <div th:case="*" class="seat seat-empty">-</div>
                        </th:block>
                    </th:block>
                </th:block>
            </div>
        </th:block>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-box" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.04);position:relative;overflow:hidden;"><i class="fas fa-star" style="position:absolute;font-size:7px;color:rgba(255,255,255,0.1);bottom:0;right:1px;"></i></div>Đã đặt</div>
        <div class="legend-item"><div class="legend-box" style="background:#3b82f6;"></div>Ghế bạn chọn</div>
        <div class="legend-item"><div class="legend-box" style="background:#3a3f47;"></div>Ghế thường</div>
        <div class="legend-item"><div class="legend-box" style="background:#f97316;"></div>Ghế VIP</div>
        <div class="legend-item"><div class="legend-box" style="background:#dc2626;"></div>Ghế đôi</div>
    </div>

    <form th:action="@{/booking/confirm}" method="post" class="bottom-bar">
        <input type="hidden" name="showtimeId" th:value="${showtimeId}" />
        <input type="hidden" name="selectedSeatIds" id="selectedSeatIds" value="" />
        <div class="bottom-left">
            <div class="label">Ghế đã chọn</div>
            <div class="seats-display" id="selectedSeatsDisplay"><span class="empty-text">Chưa có ghế nào</span></div>
            <div class="total-display">Tổng tiền: <span class="amount" id="totalDisplay">0₫</span></div>
        </div>
        <div class="btn-group">
            <a href="#" onclick="history.back();return false;" class="btn-back"><i class="fas fa-arrow-left"></i> Quay lại</a>
            <button type="submit" id="confirmBtn" disabled class="btn-pay"><i class="fas fa-ticket-alt"></i> Thanh toán</button>
        </div>
    </form>

    <div class="footer-text">SMART CINEMA &copy; 2026 &mdash; Hệ thống đặt vé thông minh</div>
</div>
</div>

<script>
(function(){var e=[],d=document.getElementById('selectedSeatsDisplay'),t=document.getElementById('totalDisplay'),i=document.getElementById('selectedSeatIds'),b=document.getElementById('confirmBtn'),fmt=function(n){return new Intl.NumberFormat('vi-VN').format(n)+'₫'};document.querySelectorAll('.seat[data-seat-id]').forEach(function(s){s.addEventListener('click',function(){var id=this.getAttribute('data-seat-id'),price=parseFloat(this.getAttribute('data-price'))||0,idx=e.indexOf(id);if(idx>-1){e.splice(idx,1);this.classList.remove('seat-selected')}else{e.push(id);this.classList.add('seat-selected')}update()})});function update(){if(e.length===0){d.innerHTML='<span class="empty-text">Chưa có ghế nào</span>';t.textContent='0₫';i.value='';b.disabled=true}else{var nms=[],total=0;document.querySelectorAll('.seat[data-seat-id]').forEach(function(s){var id=s.getAttribute('data-seat-id');if(e.indexOf(id)>-1){nms.push(s.getAttribute('data-number'));total+=parseFloat(s.getAttribute('data-price'))||0}});d.innerHTML=nms.join(', ');t.textContent=fmt(total);i.value=e.join(',');b.disabled=false}}})();
</script>
</body>
</html>
