<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${movie.title} + ' | Smart Cinema'">Phim | Smart Cinema</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --cinema-red: #E50914;
            --cinema-red-dark: #B20710;
            --cinema-red-glow: rgba(229, 9, 20, 0.35);
            --zinc-950: #09090b;
            --zinc-900: #18181b;
            --zinc-800: #27272a;
            --zinc-700: #3f3f46;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f5f5f5;
            --text-white: #ffffff;
            --text-white: #ffffff;
            --font-display: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-card: 18px;
        }
        body {
            font-family: var(--font-body);
            background-color: var(--zinc-950);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-top: 72px;
        }
        .container-cinema {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .movie-poster {
            width: 100%;
            border-radius: var(--radius-card);
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        .showtime-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 16px 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            display: block;
            color: inherit;
        }
        .showtime-card:hover {
            border-color: var(--cinema-red);
            background: rgba(229, 9, 20, 0.06);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(229, 9, 20, 0.1);
        }
        .showtime-card.sold-out {
            opacity: 0.6;
            cursor: default;
            pointer-events: none;
        }
        .showtime-card.sold-out:hover {
            border-color: var(--glass-border);
            background: var(--glass-bg);
            transform: none;
            box-shadow: none;
        }
        .sold-out-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 700;
            color: #fca5a5;
            background: rgba(229,9,20,0.1);
            border: 1px solid rgba(229,9,20,0.15);
            border-radius: 8px;
        }
        .showtime-time {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }
        .showtime-date {
            font-size: 12px;
            color: var(--text-white);
        }
        .btn-booking {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--cinema-red), var(--cinema-red-dark));
            border: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .btn-booking:hover {
            box-shadow: 0 0 24px var(--cinema-red-glow);
            transform: translateY(-1px);
            color: #fff;
        }
        .back-link {
            color: var(--text-white);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }
        .back-link:hover {
            color: #fff;
        }
        .section-accent {
            width: 5px;
            height: 28px;
            background: var(--cinema-red);
            border-radius: 3px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <nav th:replace="~{layout/navbar_customer :: navbar}"></nav>

    <main class="py-5">
        <div class="container-cinema">
            <a href="/customer/home" class="back-link mb-4 d-inline-flex align-items-center gap-2">
                <i class="fas fa-arrow-left"></i> Quay lại trang chủ
            </a>

            <div class="row g-5 mt-2">
                <div class="col-md-4">
                    <img class="movie-poster"
                         th:if="${movie.posterUrl != null}"
                         th:src="${movie.posterUrl}"
                         th:alt="${movie.title}">
                    <img class="movie-poster"
                         th:unless="${movie.posterUrl != null}"
                         src="https://placehold.co/400x600/1a1a1a/E50914?text=No+Poster"
                         alt="">
                </div>
                <div class="col-md-8">
                    <div class="d-flex align-items-center gap-3 mb-2">
                        <span class="section-accent"></span>
                        <h1 class="font-display font-bold text-white" style="font-size:clamp(1.5rem,2.5vw,2.2rem);margin:0;" th:text="${movie.title}">Tên phim</h1>
                    </div>

                    <div class="d-flex flex-wrap gap-3 mb-3">
                        <span class="d-flex align-items-center gap-1 text-sm text-white">
                            <i class="fas fa-clock" style="color:var(--cinema-red);font-size:12px;"></i>
                            <span th:text="${movie.duration} + ' phút'">120 phút</span>
                        </span>
                        <span class="d-flex align-items-center gap-1 text-sm text-white" th:if="${movie.releaseDate != null}">
                            <i class="fas fa-calendar-alt" style="color:var(--cinema-red);font-size:12px;"></i>
                            <span th:text="${#temporals.format(movie.releaseDate, 'dd/MM/yyyy')}">01/01/2024</span>
                        </span>
                    </div>

                    <p class="text-white" style="font-size:14px;line-height:1.7;" th:text="${movie.description}">Mô tả phim</p>

                    <div class="mt-5">
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <span class="section-accent"></span>
                            <h2 class="font-display font-bold text-white" style="font-size:18px;margin:0;">Suất Chiếu</h2>
                        </div>

                        <div th:if="${#lists.isEmpty(showtimes)}" class="text-center py-5">
                            <i class="fas fa-clock text-white text-3xl mb-3 block"></i>
                            <p class="text-white">Chưa có suất chiếu nào cho phim này</p>
                        </div>

                        <div th:unless="${#lists.isEmpty(showtimes)}" class="row g-3">
                            <div class="col-12 col-sm-6 col-lg-4" th:each="showtime : ${showtimes}">
                                <a class="showtime-card"
                                   th:classappend="${soldOutShowtimeIds.contains(showtime.id)} ? 'sold-out' : ''"
                                   th:href="${soldOutShowtimeIds.contains(showtime.id)} ? '#' : @{/booking/showtime/{id}(id=${showtime.id})}">
                                    <div class="d-flex align-items-center justify-content-between">
                                        <div>
                                            <div class="showtime-time" th:text="${#temporals.format(showtime.startTime, 'HH:mm')}">00:00</div>
                                            <div class="showtime-date" th:text="${#temporals.format(showtime.startTime, 'EEEE, dd/MM')}">Thứ 2, 01/01</div>
                                        </div>
                                        <div class="text-right">
                                            <div class="text-xs text-white" th:text="${showtime.room.name}">Phòng 1</div>
                                            <div class="text-sm font-semibold" style="color:var(--cinema-red);" th:text="${#numbers.formatDecimal(showtime.price, 0, 'COMMA', 0, 'POINT')} + '₫'">100,000₫</div>
                                        </div>
                                    </div>
                                    <div class="mt-3">
                                        <span th:if="${soldOutShowtimeIds.contains(showtime.id)}" class="sold-out-badge">
                                            <i class="fas fa-ban"></i> Hết Vé
                                        </span>
                                        <span th:unless="${soldOutShowtimeIds.contains(showtime.id)}" class="btn-booking">
                                            <i class="fas fa-ticket-alt"></i> Đặt Vé
                                        </span>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
