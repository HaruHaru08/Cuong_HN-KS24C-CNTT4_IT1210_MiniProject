<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header}">
    <title>Trang Chủ | Smart Cinema System</title>
</head>
<body class="bg-[#0f0f0f] text-white">
    <!-- Navbar Customer -->
    <nav th:replace="~{layout/navbar_customer :: navbar}"></nav>

    <main class="min-h-screen pb-20 pt-16">
        <!-- HERO SECTION (Banner Phim Hot) -->
        <section class="relative w-full h-[70vh] flex items-center overflow-hidden">
            <!-- Background Image with Overlay -->
            <div class="absolute inset-0 z-0">
                <img src="https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=2070"
                     class="w-full h-full object-cover opacity-40 scale-105" alt="Banner background">
                <div class="absolute inset-0 bg-gradient-to-r from-[#0f0f0f] via-transparent to-transparent"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-[#0f0f0f] to-transparent"></div>
            </div>

            <!-- Content -->
            <div class="container mx-auto px-8 relative z-10">
                <div class="max-w-2xl animate-fade-in">
                    <span class="inline-block px-3 py-1 bg-red-600 text-white text-[10px] font-bold uppercase tracking-widest rounded-full mb-6">Trending Now</span>
                    <h1 class="text-5xl md:text-7xl font-bold text-white mb-6 leading-tight font-poppins">Avengers:<br><span class="text-cinema-red">Endgame</span></h1>
                    <p class="text-lg text-white mb-8 line-clamp-3 leading-relaxed">
                        Trận chiến cuối cùng của các siêu anh hùng chống lại Thanos. Một hành trình đầy cảm xúc và quy mô chưa từng có trong lịch sử điện ảnh.
                    </p>
                    <div class="flex items-center gap-4">
                        <button class="px-8 py-4 bg-cinema-red text-white font-bold rounded-xl hover:scale-105 hover:shadow-[0_0_25px_rgba(229,9,20,0.5)] transition-all duration-300">
                            <i class="fas fa-ticket-alt mr-2"></i> Đặt Vé Ngay
                        </button>
                        <button class="px-8 py-4 bg-white bg-opacity-10 text-white font-bold rounded-xl hover:bg-opacity-20 backdrop-blur-md transition-all">
                            <i class="fas fa-info-circle mr-2"></i> Chi Tiết
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- MOVIE LIST SECTION -->
        <section class="container mx-auto px-8 mt-12">
            <div class="flex justify-between items-end mb-10">
                <div>
                    <h2 class="text-3xl font-bold text-white font-poppins mb-2">Phim Đang Chiếu</h2>
                    <div class="h-1.5 w-20 bg-cinema-red rounded-full"></div>
                </div>
                <a href="#" class="text-sm font-bold text-white hover:text-cinema-red transition-colors uppercase tracking-widest">Xem Tất Cả <i class="fas fa-chevron-right ml-1"></i></a>
            </div>

            <!-- Movies Grid -->
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-8">
                <!-- Movie Item Loop -->
                <div th:each="movie : ${nowPlaying}" class="group relative bg-[#1a1a1a] rounded-2xl overflow-hidden shadow-2xl transition-all duration-500 hover:-translate-y-2 border border-zinc-800 hover:border-cinema-red">
                    <!-- Poster -->
                    <div class="relative aspect-[2/3] overflow-hidden">
                        <img th:src="${movie.posterUrl}"
                             class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" th:alt="${movie.title}">

                        <!-- Overlay on Hover -->
                        <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-60 transition-all duration-500 flex items-center justify-center">
                            <a th:href="@{/customer/movies/{id}(id=${movie.id})}" class="opacity-0 group-hover:opacity-100 transform translate-y-4 group-hover:translate-y-0 transition-all duration-500 bg-cinema-red text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg">
                                <i class="fas fa-play text-sm"></i>
                            </a>
                        </div>

                        <!-- Rating Badge -->
                        <div class="absolute top-3 left-3 px-2 py-1 bg-yellow-500 text-white text-[10px] font-black rounded-lg">IMDb 8.5</div>
                    </div>

                    <!-- Details -->
                    <div class="p-5">
                        <p class="text-[10px] font-bold text-cinema-red uppercase tracking-widest mb-1">Phim Mới</p>
                        <h3 class="text-sm font-bold text-white line-clamp-1 mb-3 group-hover:text-cinema-red transition-colors" th:text="${movie.title}">Tên Phim</h3>
                        <div class="flex items-center justify-between text-[11px] text-white">
                            <span><i class="far fa-clock mr-1 text-cinema-red"></i> <span th:text="${movie.duration}">120</span> min</span>
                            <span th:text="${#temporals.format(movie.releaseDate, 'yyyy')}">2024</span>
                        </div>
                    </div>
                </div>

                <!-- Mockup if Empty -->
                <div th:if="${#lists.isEmpty(nowPlaying)}" th:each="i : ${#numbers.sequence(1, 5)}" class="bg-[#1a1a1a] rounded-2xl aspect-[2/3] animate-pulse border border-zinc-800"></div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer th:replace="~{layout/footer :: footer}"></footer>
</body>
</html>
